[package]
name = "linclean"
version = "0.1.0"
edition = "2021"
authors = ["you"]
description = "CLI tool for cleaning junk files on Linux (like BleachBit)"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anyhow = "1"
humansize = "2"
colored = "2"
dirs = "5"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
